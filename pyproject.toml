[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "repobrain"
version = "0.1.0"
description = "Commit-pinned code search and cited answers for Python repositories"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "tree-sitter>=0.25,<0.27", "tree-sitter-python>=0.23,<0.26", "httpx>=0.28,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
mcp = ["mcp>=1.10,<2"]

[project.scripts]
repobrain = "repobrain.cli:main"

[tool.setuptools.packages.find]
include = ["repobrain*"]

[tool.setuptools.package-data]
repobrain = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
